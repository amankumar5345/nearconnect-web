<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearConnect - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#2a14b4",
                        "on-primary": "#ffffff",
                        "primary-container": "#4338ca",
                        "on-primary-container": "#c1beff",
                        "background": "#f8f9ff",
                        "on-background": "#0b1c30",
                        "surface": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "on-surface-variant": "#464554",
                        "outline": "#777586",
                        "outline-variant": "#c7c4d7",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-lowest": "#ffffff"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface-container-lowest p-8 rounded-3xl shadow-xl border border-outline-variant">
        <div class="text-center mb-8">
            <h1 class="font-headline-lg text-3xl font-bold text-primary mb-2">NearConnect</h1>
            <p class="font-body-md text-on-surface-variant">Your local community awaits</p>
        </div>

        <div class="flex border-b border-outline-variant mb-6 relative">
            <button id="tab-login" class="flex-1 py-3 font-label-lg font-bold text-primary border-b-2 border-primary" onclick="switchTab('login')" onclick="window.location.href='event-registration-step-1.html'">Log In</button>
            <button id="tab-register" class="flex-1 py-3 font-label-lg font-bold text-on-surface-variant border-b-2 border-transparent" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4 block">
            <div id="login-error" class="hidden text-error text-sm text-center mb-2"></div>
            <div>
                <label class="block font-label-lg text-sm text-on-surface mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full h-12 px-4 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block font-label-lg text-sm text-on-surface mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full h-12 px-4 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary">
            </div>
            <button type="submit" class="w-full h-12 mt-6 bg-primary text-on-primary font-bold rounded-xl hover:bg-primary-container transition-colors" onclick="window.location.href='event-registration-step-1.html'">
                Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="space-y-4 hidden">
            <div id="register-error" class="hidden text-error text-sm text-center mb-2"></div>
            <div>
                <label class="block font-label-lg text-sm text-on-surface mb-1">Email</label>
                <input type="email" id="reg-email" required class="w-full h-12 px-4 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block font-label-lg text-sm text-on-surface mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="6" class="w-full h-12 px-4 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary">
            </div>
            <button type="submit" class="w-full h-12 mt-6 bg-primary text-on-primary font-bold rounded-xl hover:bg-primary-container transition-colors">
                Create Account
            </button>
        </form>
    </div>

    <script type="module">
        import { API_URL, setToken } from './src/auth.js';

        window.switchTab = function(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('text-primary', 'border-primary');
                tabLogin.classList.remove('text-on-surface-variant', 'border-transparent');
                tabRegister.classList.add('text-on-surface-variant', 'border-transparent');
                tabRegister.classList.remove('text-primary', 'border-primary');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('text-primary', 'border-primary');
                tabRegister.classList.remove('text-on-surface-variant', 'border-transparent');
                tabLogin.classList.add('text-on-surface-variant', 'border-transparent');
                tabLogin.classList.remove('text-primary', 'border-primary');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    setToken(data.token);
                    window.location.href = '/nearconnect-home-feed.html';
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Server connection failed';
                errorDiv.classList.remove('hidden');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('register-error');
            
            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    setToken(data.token);
                    // Redirect to onboarding after registration
                    window.location.href = '/nearconnect-onboarding-flow.html';
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Server connection failed';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
